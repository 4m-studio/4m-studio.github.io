<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080f"/>
      <stop offset="100%" stop-color="#0b0d18"/>
    </linearGradient>
    <radialGradient id="p" cx="18%" cy="6%" r="62%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="q" cx="88%" cy="90%" r="64%">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="r" cx="72%" cy="8%" r="46%">
      <stop offset="0%" stop-color="#35D6C4" stop-opacity=".26"/>
      <stop offset="100%" stop-color="#35D6C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="45%" stop-color="#B45CFF"/>
      <stop offset="100%" stop-color="#FF4D8D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#p)"/>
  <rect width="1200" height="630" fill="url(#q)"/>
  <rect width="1200" height="630" fill="url(#r)"/>

  <g transform="translate(88,96)">
    <rect width="72" height="72" rx="20" fill="url(#mark)"/>
    <text x="36" y="47" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif"
