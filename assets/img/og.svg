    <text x="94" y="47" font-family="-apple-system, Helvetica, Arial, sans-serif"
          font-size="27" font-weight="600" fill="#F5F6FA" letter-spacing="-0.6">4M Studio</text>
  </g>

  <text x="88" y="330" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="650" fill="#F5F6FA" letter-spacing="-3.4">Tiny apps.</text>
  <text x="88" y="424" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="650" fill="url(#mark)" letter-spacing="-3.4">Enormous care.</text>

  <text x="88" y="494" font-family="-apple-system, Helvetica, Arial, sans-serif"
