    <g transform="translate(20,160) rotate(4)">
      <rect width="150" height="150" rx="34" fill="#4C6BFF"/>
      <rect width="150" height="150" rx="34" fill="#2EC9FF" opacity=".4"/>
    </g>
    <g transform="translate(180,60) rotate(10)">
      <rect width="150" height="150" rx="34" fill="#52D97F"/>
      <rect width="150" height="150" rx="34" fill="#FFC93C" opacity=".38"/>
    </g>
