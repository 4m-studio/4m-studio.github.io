  <g transform="translate(870,150)" opacity=".97">
    <g transform="rotate(-8)">
      <rect width="150" height="150" rx="34" fill="#FF2E8B"/>
      <rect width="150" height="150" rx="34" fill="#FF6A3D" opacity=".45"/>
